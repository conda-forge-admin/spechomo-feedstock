schema_version: 1

context:
  name: spechomo
  version: "0.10.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/spechomo-${{ version }}.tar.gz
  sha256: ad0b15b5d885419265cc1d663b92b2cd8359787cfd394c4de59f07ac44549961

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ==3.10
    - setuptools
    - setuptools-git
  run:
    - dill
    - geoarray >=0.15.0
    - matplotlib-base
    - natsort
    - nested_dict
    - numpy <2
    - pandas
    - pyrsr >=0.5.0
    - python <=3.11
    - pyyaml
    - scikit-learn >=0.23.2,<1
    - scipy <1.11
    - seaborn
    - specclassify >=0.3.0
    - tabulate
    - tqdm

tests:
  - python:
      imports:
        - spechomo
      pip_check: true
      python_version:
        - <3.11

about:
  summary: Spectral homogenization of multispectral satellite data.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://git.gfz-potsdam.de/geomultisens/spechomo

extra:
  recipe-maintainers:
    - danschef
